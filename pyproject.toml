[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-diffusion"
version = "0.1.0"
description = "Polar diffusion models"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.12",
    "torchvision",
    "numpy",
    "pillow",
    "tqdm",
    "blobfile>=1.0.5",
]

[project.optional-dependencies]
webdataset = ["webdataset"]
monitor = ["pynvml"]

[tool.setuptools.packages.find]
include = ["polar_diffusion*"]
